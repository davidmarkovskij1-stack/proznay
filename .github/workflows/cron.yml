name: Keep alive + daily reminders
on:
  schedule:
    # каждые 5 минут — анти-сон пинг (минимальный шаг GitHub)
    - cron: '*/5 * * * *'
    # каждый день в 09:00 UTC (12:00 МСК) — напоминания
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health ping
        if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
        run: curl -sS -m 60 https://proznay.onrender.com/health
      - name: Daily reminders sweep
        if: github.event.schedule == '0 9 * * *'
        run: curl -sS -m 120 "https://proznay.onrender.com/cron/remind?key=${{ secrets.CRON_KEY }}"
